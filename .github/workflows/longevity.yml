name: longevity
on:
  schedule: [{cron: '0 5 * * 1'}]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/validate-tree.py
      - run: python scripts/stats.py
