[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-code-genius"
version = "0.1.0"
description = "Contract-driven, self-verifying orchestration tree for production web builds."
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20"]

[project.scripts]
vibe-tree = "vibe_code_genius.cli:main"

[tool.setuptools.packages.find]
include = ["vibe_code_genius*"]
