[package]
name = "godtree-desktop"
version = "0.2.0"
description = "GodTree agentic development OS"
authors = ["GodTree"]
edition = "2021"

[lib]
name = "godtree_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
